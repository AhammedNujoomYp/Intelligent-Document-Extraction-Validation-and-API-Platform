<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Financial Document Intelligence</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>

<div class="container">

    <!-- =================================================
         HEADER
         ================================================= -->

    <header>
        <h1>Financial Document Intelligence</h1>
        <p>
            Upload and process financial documents
        </p>
    </header>


    <!-- =================================================
         DOCUMENT UPLOAD
         ================================================= -->

    <section class="upload-card">

        <h2>Process Document</h2>

        <form id="documentForm">

            <!-- Document Type -->

            <label for="documentType">
                Document Type
            </label>

            <select
                id="documentType"
                required
            >

                <option value="">
                    Select document type
                </option>

                <option value="invoice">
                    Invoice
                </option>

                <option value="balance_sheet">
                    Balance Sheet
                </option>

                <option value="profit_and_loss">
                    Profit &amp; Loss
                </option>

                <option value="cash_flow_statement">
                    Cash Flow Statement
                </option>

            </select>


            <!-- File Upload -->

            <label for="documentFile">
                Upload Document
            </label>

            <input
                type="file"
                id="documentFile"
                accept=".pdf,.jpg,.jpeg,.png"
                required
            >


            <!-- Process Button -->

            <button type="submit">
                Process Document
            </button>

        </form>


        <!-- Processing Message -->

        <div id="message"></div>

    </section>


    <!-- =================================================
         PROCESSED DOCUMENTS
         ================================================= -->

    <section class="documents-section">

        <h2>Processed Documents</h2>

        <table>

            <thead>

                <tr>

                    <th>
                        Document Name
                    </th>

                    <th>
                        Document Type
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Processed At
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="documentsTable">

                <!-- Documents will be loaded by app.js -->

            </tbody>

        </table>

    </section>

</div>


<!-- =================================================
     JAVASCRIPT
     ================================================= -->

<script src="/static/js/app.js"></script>

</body>
</html>
